[package]
name = "konfirm-channel"
edition.workspace = true
license.workspace = true
version = "0.1.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
konfirm-common = { path = "../common" }
soroban-sdk = "=27.0.5"

[dev-dependencies]
# Already present transitively (soroban-sdk's own testutils::sign module
# depends on it) — declared directly here, pinned to the exact version
# already resolved in Cargo.lock, so tests can sign raw claim_payload bytes
# directly rather than going through soroban-sdk's Sign<M> trait (which
# XDR-encodes an ScVal first — not what checkpoint()'s ed25519_verify
# checks against; claim_payload builds a raw Bytes buffer, no ScVal
# involved, so the test must sign those exact raw bytes to match).
ed25519-dalek = "2.2.0"
# Property-based testing for channel numeric invariants (checkpoint
# monotonicity, conservation of funds). See issue #59.
proptest = "1.5.0"

[features]
testutils = ["soroban-sdk/testutils"]
